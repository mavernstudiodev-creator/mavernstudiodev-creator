<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Raj Tivari — Mavern Studio</title>
<desc id="d">Light editorial banner with warm grey paper, black typography and soft raspberry details.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F6F7"/><stop offset="1" stop-color="#EAE8EB"/></linearGradient>
 <radialGradient id="wash"><stop stop-color="#F5B4C9" stop-opacity=".45"/><stop offset="1" stop-color="#F5B4C9" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M0 50H100M50 0V100" stroke="#29252A" stroke-opacity=".025"/></pattern>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#paper)"/>
<rect width="1200" height="420" rx="28" fill="url(#grain)"/>
<circle cx="1030" cy="205" r="300" fill="url(#wash)"/>
<path d="M72 64H1128" stroke="#29252A" stroke-opacity=".18"/>
<path d="M72 350H1128" stroke="#29252A" stroke-opacity=".14"/>
<path d="M72 64H230" stroke="#D96D94" stroke-width="4"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#777178" font-size="15" letter-spacing="5">
 <text x="78" y="108">MAVERN STUDIO  /  DIGITAL DESIGN &amp; DEVELOPMENT</text>
</g>
<g font-family="Georgia,'Times New Roman',serif" fill="#171518">
 <text x="70" y="232" font-size="100" font-weight="bold" letter-spacing="-4">Raj Tivari<tspan fill="#D96D94">.</tspan></text>
 <text x="78" y="286" font-size="22" letter-spacing="3" fill="#514B52">DESIGN MINDS. BUILD IDEAS. SHIP EXPERIENCES.</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" fill="#817B82" font-size="12" letter-spacing="3">
 <text x="80" y="390">INDEPENDENT CREATOR  ·  COMPUTER SCIENCE</text>
 <text x="1120" y="390" text-anchor="end">BENGALURU, INDIA</text>
</g>
<circle cx="1080" cy="130" r="5" fill="#D96D94"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="1110" cy="155" r="3" fill="#E8A5BA"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
</svg>